[package]
name = "dan-rl-ipc"
version = "0.1.0"
edition = "2024"

[features]
default = ["py"]
py = []

[dependencies]
thiserror = "2.0.16"
clap = { version = "4.5.53", features = ["derive"] }
signal-hook = "0.4.1"

dan-rl-core = { path = "../dan-rl-core" }
dan-config = { git = "https://github.com/dansunA1/dan-config", branch = "main" }

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

iceoryx2 = { version = "0.8.0", default-features = false, features = []}
iceoryx2-loggers = { version = "0.8.0", default-features = false, features = ["std", "tracing"]}
tracing-appender = "0.2.4"
once_cell = "1.21.3"

pyo3 = "0.27.0"
numpy = "0.27.1"
pyo3-ffi = "0.27.1"

